<!DOCTYPE html>
<html>

<head>

<title>HealthTech Dashboard</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{

    min-height:100vh;
    background:linear-gradient(135deg,#0f172a,#1e1b4b);
    padding:40px;

}

.container{

    max-width:1100px;
    margin:auto;
    background:rgba(255,255,255,0.1);
    backdrop-filter:blur(15px);
    padding:30px;
    border-radius:20px;
    box-shadow:0 20px 50px rgba(0,0,0,0.5);

}

h1{

    color:white;
    text-align:center;
    margin-bottom:30px;

}


.grid{

    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;

}


.field{

    display:flex;
    flex-direction:column;

}


label{

    color:#c7d2fe;
    margin-bottom:8px;
    font-weight:bold;

}


input{

    padding:12px;
    border:none;
    border-radius:10px;
    background:rgba(255,255,255,0.15);
    color:white;

}


button{

    width:100%;
    margin-top:25px;
    padding:14px;
    border:none;
    border-radius:12px;
    background:#4f46e5;
    color:white;
    font-size:16px;
    cursor:pointer;

}


button:hover{

    background:#4338ca;

}


.logout{

    background:#dc2626;

}


.section-title{

    color:white;
    margin-top:25px;
    margin-bottom:10px;
    font-size:18px;
    font-weight:bold;

}


.output{

    background:rgba(0,0,0,0.35);
    color:white;
    padding:15px;
    border-radius:12px;
    min-height:50px;
    white-space:pre-wrap;

}


</style>

</head>


<body>


<div class="container">


<h1>
🏥 HealthTech PHI/PII Redaction Dashboard
</h1>



<div class="grid">


<div class="field">
<label>Patient First Name</label>
<input id="firstName">
</div>


<div class="field">
<label>Patient Last Name</label>
<input id="lastName">
</div>


<div class="field">
<label>Email</label>
<input id="email">
</div>


<div class="field">
<label>Phone Number</label>
<input id="phone">
</div>


<div class="field">
<label>Hospital Name</label>
<input id="hospital">
</div>


<div class="field">
<label>Disease</label>
<input id="disease">
</div>


<div class="field">
<label>Doctor Name</label>
<input id="doctor">
</div>


<div class="field">
<label>City</label>
<input id="city">
</div>


</div>



<button onclick="redactText()">
Generate Safe Output
</button>



<div class="section-title">
Redacted Output
</div>

<div class="output" id="output">
No output yet
</div>



<div class="section-title">
Entities Found
</div>

<div class="output" id="entityCount">
0
</div>



<div class="section-title">
Detected Entity Types
</div>

<div class="output" id="entityTypes">
None
</div>



<div class="section-title">
API Latency
</div>

<div class="output" id="latency">
0 ms
</div>



<button class="logout" onclick="logout()">
Logout
</button>


</div>





<script>


let token = localStorage.getItem("token");


// Block direct dashboard access

if(!token){

    window.location.href="/";

}




async function redactText(){


let text = `

Patient Name:
${document.getElementById("firstName").value}
${document.getElementById("lastName").value}

Email:
${document.getElementById("email").value}

Phone:
${document.getElementById("phone").value}

Hospital:
${document.getElementById("hospital").value}

Disease:
${document.getElementById("disease").value}

Doctor:
${document.getElementById("doctor").value}

City:
${document.getElementById("city").value}

`;



let startTime = Date.now();



const response = await fetch("/redact",{

method:"POST",

headers:{

"Content-Type":"application/json",

"Authorization":"Bearer " + token

},


body:JSON.stringify({

text:text

})


});



let endTime = Date.now();



const data = await response.json();



document.getElementById("output").innerText =
data.redacted || data.error;



document.getElementById("entityCount").innerText =
data.entities_found || 0;



document.getElementById("entityTypes").innerText =
data.entity_types ?
data.entity_types.join(", ")
:
"None";



document.getElementById("latency").innerText =
(endTime-startTime)+" ms";


}




function logout(){

localStorage.removeItem("token");

localStorage.removeItem("role");

window.location.href="/";

}


</script>


</body>

</html>
